name: CI

on:
    push:
        branches: [main, beta]
    pull_request:
        branches: [main, beta]

jobs:
    checks:
        name: Lint, typecheck, build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm install --include=optional

            - name: Lint
              run: npm run lint

            - name: Build client (includes typecheck)
              run: npm run client:build

            - name: Build api
              run: npm run api:build

    tests:
        name: Test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm install --include=optional

            - name: Test
              run: npm run client:test
