version: 2
updates:
    - package-ecosystem: npm
      directory: /
      target-branch: beta
      schedule:
          interval: weekly
      open-pull-requests-limit: 5
      groups:
          dev-dependencies:
              dependency-type: development
              update-types:
                  - minor
                  - patch
          production-dependencies:
              dependency-type: production
              update-types:
                  - minor
                  - patch

    - package-ecosystem: github-actions
      directory: /
      target-branch: beta
      schedule:
          interval: weekly
